

name: ClipsXtra Zero - Radar GTA 6

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar radar
        run: python .github/workflows/radar.py

      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: resultados-radar-gta6
          path: resultados/radar.json
